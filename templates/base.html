<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{% block title %}garage4u{% endblock %}</title>

    <!-- PWA & Favicon -->
    <link rel="manifest" href="/static/manifest.json">
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/icons/icon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/icons/icon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#0284c7">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="garage4u">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="application-name" content="garage4u">
    <meta name="description" content="نظام إدارة وقوف السيارات المتكامل">
    <meta name="msapplication-TileColor" content="#060911">
    <meta name="msapplication-TileImage" content="/static/icons/icon-144x144.png">

    <!-- Google Fonts: Cairo & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Outfit:wght@500;700;800;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/static/css/tailwind.min.css?v=20261020">
    <style>
        *, ::before, ::after {
            border-color: #1e293b;
        }
        body {
            font-family: 'Cairo', 'Segoe UI', Tahoma, Arial, sans-serif;
            background-color: #060911;
            color: #f8fafc;
        }
        :root {
            font-family: 'Cairo', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body class="bg-[#060911] text-slate-100 min-h-screen flex flex-col antialiased selection:bg-cyan-500 selection:text-white" style="background-color: #060911; color: #f8fafc;">
    {% block nav %}
    <nav class="bg-[#0b0f19]/90 backdrop-blur-md border-b border-slate-800/80 px-4 lg:px-8 py-2.5 flex justify-between items-center shadow-lg z-50" style="background-color: #0b0f19;">
        <div class="flex items-center gap-3">
            <img src="/static/icons/icon-32x32.png" alt="garage4u" width="28" height="28" class="w-7 h-7 rounded-lg shadow-md border border-cyan-500/30" style="width: 28px; height: 28px; display: block; flex-shrink: 0;">
            <div class="text-xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-sky-300 to-indigo-400" style="font-family: 'Outfit', sans-serif;">
                garage4u
            </div>
            <div class="h-5 w-px bg-slate-700 mx-1 hidden sm:block"></div>
            <span class="text-white text-base sm:text-lg font-black tracking-wide">
                جراج باب اللوق
            </span>
        </div>
        <div class="flex items-center gap-3">
            {% if user %}
            <div class="hidden sm:flex items-center gap-2 bg-slate-900/80 border border-slate-800 px-3 py-1.5 rounded-xl text-xs" style="background-color: #0f172a;">
                <span class="w-2 h-2 rounded-full bg-emerald-400" style="width: 8px; height: 8px; display: inline-block;"></span>
                <span class="text-slate-300 font-bold">{{ user.full_name }}</span>
                <span class="text-slate-500">({{ user.role.value }})</span>
            </div>
            {% endif %}
            <!-- <form method="POST" action="/ui/logout" class="inline">
                <button type="submit" class="bg-rose-950/60 hover:bg-rose-900 text-rose-300 hover:text-white border border-rose-800/60 font-bold py-1.5 px-3.5 rounded-xl text-xs transition duration-150 shadow-sm" style="background-color: #4c0519; color: #fda4af;">
                    {{ t("nav.logout") if t is defined else "تسجيل الخروج" }}
                </button>
            </form> -->
        </div>
    </nav>
    {% endblock %}

    <main class="flex-grow flex flex-col">
        {% block content %}{% endblock %}
    </main>

    {% block scripts %}{% endblock %}

    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/static/sw.js')
            .then(function(reg) { console.log('[SW] Registered:', reg.scope); })
            .catch(function(err) { console.warn('[SW] Registration failed:', err); });
        });
      }
    </script>
</body>
</html>
